name: Propagate Build Tags for Docker Projects

# This GitHub Actions workflow detects a trigger from a dependency
# repository to update a release tag, tags the repository, then
# propagates the trigger to its dependent repositories.

on:
  repository_dispatch:
    types: [dependency-tag]
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'The name of the tag to create'
        required: true
        type: string
      propagate:
        description: 'Propagate this tag?'
        required: true
        type: boolean
        default: true
      branch:
        description: 'The branch to use for the dispatch. Defaults to main.'
        required: false
        type: string
        default: 'main'

jobs:

  check-dependencies-and-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || inputs.branch }}
    - name: Set up JDK 17
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Check Existing Deploy
      uses: kentyou/build-automation/actions/maven-deploy-check@7fa6d006023adb35d21e65d00cb3080ea1df0cc0 # v1.1.1 to be released?
      with:
        artifact: 'artifactGroupId:artifactId:${version}'
        tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
        cancel-workflow: 'MISSING'
        repo-secret: ${{ secrets.KENTYOU_CI_PAT }}
    - name: Set up Docker
      uses: kentyou/build-automation/actions/docker-setup@1f7bed89a5408924188b2d9b661a678d7e332411
      with:
          docker-user: ${{ github.actor }}
          docker-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push Docker Image
      uses: kentyou/build-automation/actions/docker-push@1f7bed89a5408924188b2d9b661a678d7e332411
      with:
          push-image: true
          maven-token: ${{ secrets.KENTYOU_CI_PAT }}
          tag-base: ghcr.io/kentyou/[BASE]
          tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
    - name: Publish Tag to GitHub
      uses: kentyou/build-automation/actions/github-repo-tag@1f7bed89a5408924188b2d9b661a678d7e332411
      with:
          tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}

  notify-dependents:

    runs-on: ubuntu-latest
    needs: check-dependencies-and-tag
    if: ${{ toJSON(inputs.propagate) == 'true' }}

    strategy:
      matrix:
        repo-name: ['dep-1', 'dep-2']

    steps:
    - name: Notify dependents
      # TODO: Update version of this workflow once it has been released
      uses: kentyou/build-automation/actions/downstream-dispatch@8b025512d5909eab6643d47792e107b94b484ab3 # dml/tagging
      with:
        repo-name: ${{ matrix.repo-name }}
        tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
        repo-secret: ${{ secrets.KENTYOU_DISPATCH_PAT }}
        branch: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || inputs.branch }}

