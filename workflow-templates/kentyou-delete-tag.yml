# Deletes a repositor tag and all packages that are tagged with the
# given version and tag.

# THIS IS A DESTRUCTIVE ACTION. USE WITH CAUTION!!

name: Delete GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the packages to be deleted'
        required: true
      tag:
        description: 'Tag of the packages to be deleted'
        required: true

jobs:
  delete-packages:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Delete Packages
      run: |
        VERSION="${{ github.event.inputs.version }}"
        TAG="${{ github.event.inputs.tag }}"
        COMPOSED_VERSION="${VERSION}.${TAG}"

        if [ -z "$VERSION" ]; then
          echo "Version input is required"
          exit 1
        fi

        if [ -z "$TAG" ]; then
          echo "Tag input is required"
          exit 1
        fi

        echo "Deleting packages with version: $COMPOSED_VERSION"

        # Function to fetch all packages with pagination
        get_all_packages() {
          page=1
          per_page=100
          packages="[]"

          while true; do
            result=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/orgs/${{ github.repository_owner }}/packages?package_type=maven&per_page=$per_page&page=$page")

            if [ "$(echo "$result" | jq 'length')" -eq 0 ]; then
              break
            fi

            packages=$(echo "$packages $result" | jq -s 'add')
            page=$((page + 1))
          done

          echo "$packages"
        }

        packages=$(get_all_packages)

        if [ "$(echo "$packages" | jq 'length')" -eq 0 ]; then
          echo "No packages found (returned array was empty)"
          exit 0
        fi

        # Log the number of packages
        num_packages=$(echo "$packages" | jq 'length')
        echo "Number of packages to be checked: $num_packages"

        # Iterate over each package
        echo "$packages" | jq -c '.[]' | while IFS= read -r package; do
          package_name=$(echo "$package" | jq -r '.name')
          echo "Checking package: $package_name"

          match_found=false

          # Get all versions of the current package
          versions=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/maven/$package_name/versions")

          # Ensure the response is a valid JSON array and not null or empty
          if [ "$(echo "$versions" | jq 'type')" == "null" ]; then
            echo "No versions found for package $package_name"
            continue
          fi

          if [ "$(echo "$versions" | jq 'length')" -eq 0 ]; then
            echo "No versions found for package $package_name"
            continue
          fi

          # Iterate over each version
          echo "$versions" | jq -c '.[]' | while IFS= read -r version; do
            version_name=$(echo "$version" | jq -r '.name')

            # Check if the composed version matches the name
            if [[ "$version_name" == "$COMPOSED_VERSION" ]]; then
              echo "Found matching version: $version_name in package: $package_name"
              match_found=true
              version_id=$(echo "$version" | jq -r '.id')
              echo "Deleting version ID: $version_id of package: $package_name"
              curl -s -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/orgs/${{ github.repository_owner }}/packages/maven/$package_name/versions/$version_id" \
                -o /dev/null
            fi
          done

          if [ "$match_found" = false ]; then
            echo "No matching version found in package: $package_name"
          fi
        done

  delete-tag:
    runs-on: ubuntu-latest
    needs: delete-packages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Delete tag locally
      run: |
        TAG="${{ github.event.inputs.tag }}"
        git tag -d "$TAG" || echo "Tag $TAG does not exist locally"

    - name: Delete tag remotely
      run: |
        TAG="${{ github.event.inputs.tag }}"
        git push origin --delete "$TAG" || echo "Tag $TAG does not exist remotely"
