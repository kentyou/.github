name: Propagate Build Tags for Maven Projects

# This GitHub Actions workflow detects a downstream trigger to
# update a release tag, tags the repository, then propagates the
# trigger to upstream repositories.
#
# It is triggered by a repository dispatch event from a
# dependency, and will then (if possible) create the
# same tag in this repository
#
# Implementation note: this workflow would be a lot cleaner if
# it were to use matricies, but unfortunately at this time
# they allow allow for a single output. We need to ensure that
# ALL of the dependencies are deployed. There are some workarounds,
# but I decided that it wasn't worth the bother. So for now, all
# dependencies need to be listed one-by-one.
#  --> See: https://github.com/orgs/community/discussions/17245

on:
  repository_dispatch:
    types: [dependency-tag]
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'The name of the tag to create'
        required: true
        type: string
      propagate:
        description: 'Propagate this tag or not?'
        required: true
        type: boolean
        default: true

jobs:

  check-dependencies-and-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Set up JDK 17
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Check Existing Deploy
      uses: kentyou/build-automation/actions/maven-deploy-check@7fa6d006023adb35d21e65d00cb3080ea1df0cc0# v1.1.1 to be released?
      with:
        artifact: 'artifactGroup:artifactID:${version}'
        module-path: parent
        tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
        cancel-workflow: 'MISSING'
        repo-secret: ${{ secrets.KENTYOU_DISPATCH_PAT }}
    - name: Create and Publish tag
      uses: kentyou/build-automation/actions/maven-tag@f08ff697ccd326ae99f9dc675a7b1b201029f5c2 # v1.1.0
      with:
        tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
        repo-secret: ${{ secrets.GITHUB_TOKEN }}

  notify-dependents:

    runs-on: ubuntu-latest
    needs: check-dependencies-and-tag
    if: ${{ toJSON(inputs.propagate) == 'true' }}

    strategy:
      matrix:
        repo-name: ['oidc-rest', 'kentyou-ai']

    steps:
    - name: Notify dependents
      uses: kentyou/build-automation/actions/downstream-dispatch@c97a00fe04569dc601a316aabb0fe9068a26724b # v1.0.0
      with:
        repo-name: ${{ matrix.repo-name }}
        tag-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag-name || inputs.tag-name }}
        repo-secret: ${{ secrets.KENTYOU_DISPATCH_PAT }}
